<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mening Profilim - BUKHARA REST</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        .profile-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        
        .profile-header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }
        
        .profile-avatar {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: white;
        }
        
        .profile-name {
            font-size: 24px;
            color: var(--secondary);
            margin-bottom: 5px;
        }
        
        .profile-email {
            color: var(--gray);
            margin-bottom: 15px;
        }
        
        .profile-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .stat-item {
            text-align: center;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        
        .stat-number {
            font-size: 28px;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 5px;
        }
        
        .stat-label {
            color: var(--gray);
            font-size: 14px;
        }
        
        .profile-tabs {
            display: flex;
            border-bottom: 1px solid #eee;
            margin-bottom: 30px;
        }
        
        .profile-tab {
            padding: 15px 30px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            color: var(--gray);
            position: relative;
            transition: all 0.3s;
        }
        
        .profile-tab.active {
            color: var(--primary);
            font-weight: 600;
        }
        
        .profile-tab.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--primary);
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
            animation: fadeIn 0.5s;
        }
        
        .booking-card {
            background: white;
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            transition: transform 0.3s;
        }
        
        .booking-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .booking-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .booking-date {
            font-weight: 600;
            color: var(--secondary);
        }
        
        .booking-status {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .status-pending {
            background: #fff3cd;
            color: #856404;
        }
        
        .status-confirmed {
            background: #d4edda;
            color: #155724;
        }
        
        .status-cancelled {
            background: #f8d7da;
            color: #721c24;
        }
        
        .booking-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .detail-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #f5f5f5;
        }
        
        .detail-label {
            color: var(--gray);
        }
        
        .detail-value {
            font-weight: 500;
        }
        
        .booking-actions {
            display: flex;
            gap: 10px;
        }
        
        .no-data {
            text-align: center;
            padding: 40px;
            color: var(--gray);
        }
        
        .no-data i {
            font-size: 48px;
            margin-bottom: 20px;
            color: #ddd;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">🏰 BUKHARA REST</a>
            <div class="nav-links">
                <a href="index.html">Asosiy</a>
                <a href="menu.html">Menyu</a>
                <a href="booking.html">Bron Qilish</a>
                <a href="about.html">Biz Haqimizda</a>
                <a href="contact.html">Aloqa</a>
                <a href="profile.html" class="btn-login active"><i class="fas fa-user"></i> Profilim</a>
                <a href="admin.html" class="btn-admin"><i class="fas fa-cog"></i> Admin</a>
            </div>
            <div class="hamburger">
                <i class="fas fa-bars"></i>
            </div>
        </div>
    </nav>

    <!-- Profile Section -->
    <section class="section">
        <div class="container">
            <div class="profile-container" id="profileContainer">
                <!-- Profile content will be loaded by JavaScript -->
                <div class="text-center">
                    <div class="loading-spinner" style="width: 40px; height: 40px; margin: 0 auto 20px;"></div>
                    <p>Profil ma'lumotlari yuklanmoqda...</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-grid">
                <div>
                    <h3>BUKHARA REST</h3>
                    <p>O'zbek milliy taomlarining eng yaxshi namunalari</p>
                </div>
                <div>
                    <h3>Foydali Havolalar</h3>
                    <a href="menu.html">Menyu</a>
                    <a href="booking.html">Bron Qilish</a>
                    <a href="about.html">Biz Haqimizda</a>
                </div>
                <div>
                    <h3>Ijtimoiy Tarmoqlar</h3>
                    <div class="social-icons">
                        <a href="#"><i class="fab fa-facebook"></i></a>
                        <a href="#"><i class="fab fa-instagram"></i></a>
                        <a href="#"><i class="fab fa-telegram"></i></a>
                    </div>
                </div>
            </div>
            <p class="copyright">© 2024 BUKHARA REST. Barcha huquqlar himoyalangan.</p>
        </div>
    </footer>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js"></script>
    <script src="config.js"></script>
    <script>
        // Profile JavaScript
        document.addEventListener('DOMContentLoaded', function() {
            checkAuthAndLoadProfile();
            setupMobileMenu();
        });
        
        function setupMobileMenu() {
            const hamburger = document.querySelector('.hamburger');
            const navLinks = document.querySelector('.nav-links');
            
            if (hamburger && navLinks) {
                hamburger.addEventListener('click', function() {
                    const isDisplayed = navLinks.style.display === 'flex';
                    navLinks.style.display = isDisplayed ? 'none' : 'flex';
                    
                    if (window.innerWidth <= 768) {
                        if (!isDisplayed) {
                            navLinks.style.flexDirection = 'column';
                            navLinks.style.position = 'absolute';
                            navLinks.style.top = '100%';
                            navLinks.style.left = '0';
                            navLinks.style.right = '0';
                            navLinks.style.background = 'white';
                            navLinks.style.padding = '20px';
                            navLinks.style.boxShadow = '0 10px 20px rgba(0,0,0,0.1)';
                            navLinks.style.gap = '15px';
                        }
                    }
                });
            }
        }
        
        function checkAuthAndLoadProfile() {
            auth.onAuthStateChanged(function(user) {
                if (user) {
                    loadUserProfile(user);
                    loadUserBookings(user.uid);
                } else {
                    // Redirect to login if not authenticated
                    window.location.href = 'auth.html?redirect=profile';
                }
            });
        }
        
        function loadUserProfile(user) {
            const profileContainer = document.getElementById('profileContainer');
            
            // Get user data from database
            db.ref('users/' + user.uid).once('value').then(function(snapshot) {
                const userData = snapshot.val() || {};
                
                // Get user's bookings count
                db.ref('bookings').orderByChild('userId').equalTo(user.uid).once('value').then(function(bookingsSnapshot) {
                    const bookings = bookingsSnapshot.val() || {};
                    const totalBookings = Object.keys(bookings).length;
                    
                    // Get confirmed bookings count
                    let confirmedBookings = 0;
                    Object.values(bookings).forEach(booking => {
                        if (booking.status === 'confirmed') {
                            confirmedBookings++;
                        }
                    });
                    
                    // Render profile
                    profileContainer.innerHTML = `
                        <div class="profile-header">
                            <div class="profile-avatar">
                                <i class="fas fa-user"></i>
                            </div>
                            <h2 class="profile-name">${userData.name || 'Foydalanuvchi'}</h2>
                            <p class="profile-email">${user.email}</p>
                            <p><i class="fas fa-phone"></i> ${userData.phone || 'Telefon raqami kiritilmagan'}</p>
                        </div>
                        
                        <div class="profile-stats">
                            <div class="stat-item">
                                <div class="stat-number">${totalBookings}</div>
                                <div class="stat-label">Jami Bronlar</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-number">${confirmedBookings}</div>
                                <div class="stat-label">Tasdiqlangan</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-number">${new Date(user.metadata.creationTime).toLocaleDateString('uz-UZ')}</div>
                                <div class="stat-label">Ro'yxatdan O'tish</div>
                            </div>
                        </div>
                        
                        <div class="profile-tabs">
                            <button class="profile-tab active" onclick="switchTab('bookings')">
                                <i class="fas fa-calendar"></i> Mening Bronlarim
                            </button>
                            <button class="profile-tab" onclick="switchTab('settings')">
                                <i class="fas fa-cog"></i> Sozlamalar
                            </button>
                            <button class="profile-tab" onclick="switchTab('help')">
                                <i class="fas fa-question-circle"></i> Yordam
                            </button>
                        </div>
                        
                        <!-- Bookings Tab -->
                        <div id="bookingsTab" class="tab-content active">
                            <div id="bookingsList"></div>
                        </div>
                        
                        <!-- Settings Tab -->
                        <div id="settingsTab" class="tab-content">
                            <h3><i class="fas fa-user-edit"></i> Profil Sozlamalari</h3>
                            <form id="profileForm" class="profile-form">
                                <div class="form-group">
                                    <label for="profileName">Ism</label>
                                    <input type="text" id="profileName" value="${userData.name || ''}" placeholder="Ismingiz">
                                </div>
                                
                                <div class="form-group">
                                    <label for="profilePhone">Telefon</label>
                                    <input type="tel" id="profilePhone" value="${userData.phone || ''}" placeholder="+998 XX XXX-XX-XX">
                                </div>
                                
                                <div class="form-group">
                                    <label for="profileEmail">Email</label>
                                    <input type="email" id="profileEmail" value="${user.email}" disabled>
                                    <small>Emailni o'zgartirish uchun biz bilan bog'laning</small>
                                </div>
                                
                                <div class="form-group">
                                    <label for="currentPassword">Joriy Parol</label>
                                    <input type="password" id="currentPassword" placeholder="Joriy parolingiz">
                                </div>
                                
                                <div class="form-group">
                                    <label for="newPassword">Yangi Parol</label>
                                    <input type="password" id="newPassword" placeholder="Yangi parol">
                                </div>
                                
                                <div class="form-group">
                                    <label for="confirmPassword">Yangi Parolni Tasdiqlash</label>
                                    <input type="password" id="confirmPassword" placeholder="Yangi parolni qayta kiriting">
                                </div>
                                
                                <div class="form-actions">
                                    <button type="submit" class="btn-primary">
                                        <i class="fas fa-save"></i> Saqlash
                                    </button>
                                    <button type="button" onclick="logout()" class="btn-danger">
                                        <i class="fas fa-sign-out-alt"></i> Chiqish
                                    </button>
                                </div>
                            </form>
                        </div>
                        
                        <!-- Help Tab -->
                        <div id="helpTab" class="tab-content">
                            <h3><i class="fas fa-question-circle"></i> Yordam va Qo'llanma</h3>
                            <div class="help-content">
                                <h4>Tez-tez So'raladigan Savollar</h4>
                                <div class="faq-item">
                                    <h5>Bronni qanday o'zgartirsam bo'ladi?</h5>
                                    <p>Bronni o'zgartirish uchun bron ro'yxatidan tanlab, "Tahrirlash" tugmasini bosing yoki bizga qo'ng'iroq qiling.</p>
                                </div>
                                
                                <div class="faq-item">
                                    <h5>Bronni qanday bekor qilsam bo'ladi?</h5>
                                    <p>Bronni kamida 2 soat oldin bekor qilishingiz kerak. Profilingizdagi bron ro'yxatidan bekor qilish mumkin.</p>
                                </div>
                                
                                <div class="faq-item">
                                    <h5>Parolni qanday o'zgartirsam bo'ladi?</h5>
                                    <p>"Sozlamalar" bo'limida parolni o'zgartirishingiz mumkin.</p>
                                </div>
                                
                                <div class="contact-support">
                                    <h4><i class="fas fa-headset"></i> Qo'shimcha Yordam</h4>
                                    <p>Agar savollaringiz bo'lsa, biz bilan bog'laning:</p>
                                    <p><i class="fas fa-phone"></i> +998 90 123 45 67</p>
                                    <p><i class="fas fa-envelope"></i> support@bukhararest.uz</p>
                                </div>
                            </div>
                        </div>
                    `;
                    
                    // Add event listener for profile form
                    const profileForm = document.getElementById('profileForm');
                    if (profileForm) {
                        profileForm.addEventListener('submit', handleProfileUpdate);
                    }
                    
                }).catch(error => {
                    console.error('Error loading bookings:', error);
                    profileContainer.innerHTML = `
                        <div class="text-center">
                            <i class="fas fa-exclamation-triangle" style="font-size: 48px; color: #dc3545; margin-bottom: 20px;"></i>
                            <h3>Xatolik yuz berdi</h3>
                            <p>Ma'lumotlarni yuklashda xatolik: ${error.message}</p>
                            <button onclick="location.reload()" class="btn-primary mt-20">
                                <i class="fas fa-redo"></i> Qayta Yuklash
                            </button>
                        </div>
                    `;
                });
                
            }).catch(error => {
                console.error('Error loading user data:', error);
            });
        }
        
        function loadUserBookings(userId) {
            db.ref('bookings').orderByChild('userId').equalTo(userId).once('value').then(function(snapshot) {
                const bookings = snapshot.val() || {};
                const bookingsList = document.getElementById('bookingsList');
                
                if (bookingsList) {
                    if (Object.keys(bookings).length === 0) {
                        bookingsList.innerHTML = `
                            <div class="no-data">
                                <i class="fas fa-calendar-times"></i>
                                <h3>Hali bron qilmagansiz</h3>
                                <p>Birinchi bron qilish uchun bron qilish sahifasiga o'ting</p>
                                <a href="booking.html" class="btn-primary mt-20">
                                    <i class="fas fa-calendar-plus"></i> Bron Qilish
                                </a>
                            </div>
                        `;
                    } else {
                        bookingsList.innerHTML = '';
                        
                        // Sort bookings by date (newest first)
                        const sortedBookings = Object.entries(bookings)
                            .sort(([, a], [, b]) => new Date(b.createdAt) - new Date(a.createdAt));
                        
                        sortedBookings.forEach(([id, booking]) => {
                            const bookingCard = document.createElement('div');
                            bookingCard.className = 'booking-card';
                            
                            const statusClass = booking.status === 'confirmed' ? 'status-confirmed' :
                                              booking.status === 'pending' ? 'status-pending' : 'status-cancelled';
                            const statusText = booking.status === 'confirmed' ? 'Tasdiqlangan' :
                                              booking.status === 'pending' ? 'Kutilmoqda' : 'Bekor qilingan';
                            
                            bookingCard.innerHTML = `
                                <div class="booking-header">
                                    <div class="booking-date">
                                        <i class="fas fa-calendar-day"></i>
                                        ${booking.date} • ${booking.time}
                                    </div>
                                    <span class="booking-status ${statusClass}">${statusText}</span>
                                </div>
                                
                                <div class="booking-details">
                                    <div class="detail-item">
                                        <span class="detail-label">Mehmonlar:</span>
                                        <span class="detail-value">${booking.guests} kishi</span>
                                    </div>
                                    <div class="detail-item">
                                        <span class="detail-label">Telefon:</span>
                                        <span class="detail-value">${booking.phone || 'N/A'}</span>
                                    </div>
                                    <div class="detail-item">
                                        <span class="detail-label">Bron raqami:</span>
                                        <span class="detail-value">${id.substring(0, 8)}...</span>
                                    </div>
                                    <div class="detail-item">
                                        <span class="detail-label">Bron vaqti:</span>
                                        <span class="detail-value">${new Date(booking.createdAt).toLocaleString('uz-UZ')}</span>
                                    </div>
                                </div>
                                
                                ${booking.notes ? `
                                <div class="booking-notes">
                                    <strong><i class="fas fa-sticky-note"></i> Izoh:</strong>
                                    <p>${booking.notes}</p>
                                </div>
                                ` : ''}
                                
                                <div class="booking-actions">
                                    ${booking.status === 'pending' ? `
                                    <button onclick="cancelBooking('${id}')" class="btn-small btn-danger">
                                        <i class="fas fa-times"></i> Bekor Qilish
                                    </button>
                                    ` : ''}
                                    <button onclick="viewBookingDetails('${id}')" class="btn-small btn-info">
                                        <i class="fas fa-eye"></i> Ko'rish
                                    </button>
                                </div>
                            `;
                            
                            bookingsList.appendChild(bookingCard);
                        });
                    }
                }
            }).catch(error => {
                console.error('Error loading user bookings:', error);
            });
        }
        
        function switchTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // Remove active class from all tab buttons
            document.querySelectorAll('.profile-tab').forEach(btn => {
                btn.classList.remove('active');
            });
            
            // Show selected tab
            document.getElementById(tabName + 'Tab').classList.add('active');
            
            // Add active class to clicked button
            event.target.classList.add('active');
            
            // Load data for bookings tab
            if (tabName === 'bookings') {
                const user = auth.currentUser;
                if (user) {
                    loadUserBookings(user.uid);
                }
            }
        }
        
        async function handleProfileUpdate(e) {
            e.preventDefault();
            
            const user = auth.currentUser;
            if (!user) return;
            
            const name = document.getElementById('profileName').value;
            const phone = document.getElementById('profilePhone').value;
            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            try {
                // Update user data in database
                await db.ref('users/' + user.uid).update({
                    name: name,
                    phone: phone,
                    updatedAt: new Date().toISOString()
                });
                
                // Update password if provided
                if (newPassword) {
                    if (newPassword !== confirmPassword) {
                        showNotification('Yangi parollar mos kelmadi', 'error');
                        return;
                    }
                    
                    if (newPassword.length < 6) {
                        showNotification('Parol kamida 6 ta belgidan iborat bo\'lishi kerak', 'error');
                        return;
                    }
                    
                    // Re-authenticate user before changing password
                    const credential = firebase.auth.EmailAuthProvider.credential(
                        user.email,
                        currentPassword
                    );
                    
                    await user.reauthenticateWithCredential(credential);
                    await user.updatePassword(newPassword);
                    
                    // Clear password fields
                    document.getElementById('currentPassword').value = '';
                    document.getElementById('newPassword').value = '';
                    document.getElementById('confirmPassword').value = '';
                }
                
                showNotification('Profil muvaffaqiyatli yangilandi!', 'success');
                
                // Update display name if changed
                if (name !== user.displayName) {
                    await user.updateProfile({ displayName: name });
                }
                
            } catch (error) {
                let errorMessage = 'Profilni yangilashda xatolik: ';
                
                switch (error.code) {
                    case 'auth/wrong-password':
                        errorMessage = 'Joriy parol noto\'g\'ri';
                        break;
                    case 'auth/weak-password':
                        errorMessage = 'Yangi parol juda oddiy, mustahkamroq parol tanlang';
                        break;
                    default:
                        errorMessage += error.message;
                }
                
                showNotification(errorMessage, 'error');
            }
        }
        
        function cancelBooking(bookingId) {
            if (confirm('Haqiqatan ham bu bronni bekor qilmoqchimisiz?')) {
                db.ref('bookings/' + bookingId + '/status').set('cancelled').then(() => {
                    showNotification('Bron bekor qilindi', 'success');
                    
                    // Reload bookings
                    const user = auth.currentUser;
                    if (user) {
                        loadUserBookings(user.uid);
                    }
                }).catch(error => {
                    showNotification('Bronni bekor qilishda xatolik: ' + error.message, 'error');
                });
            }
        }
        
        function viewBookingDetails(bookingId) {
            db.ref('bookings/' + bookingId).once('value').then(function(snapshot) {
                const booking = snapshot.val();
                
                if (booking) {
                    const modalContent = `
                        <div class="modal-header">
                            <h3><i class="fas fa-calendar-check"></i> Bron Ma'lumotlari</h3>
                        </div>
                        
                        <div class="booking-details-modal">
                            <div class="detail-row">
                                <span class="detail-label">Ism:</span>
                                <span class="detail-value">${booking.userName || 'N/A'}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Telefon:</span>
                                <span class="detail-value">${booking.phone || 'N/A'}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Email:</span>
                                <span class="detail-value">${booking.email || 'N/A'}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Sana:</span>
                                <span class="detail-value">${booking.date || 'N/A'}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Vaqt:</span>
                                <span class="detail-value">${booking.time || 'N/A'}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Mehmonlar:</span>
                                <span class="detail-value">${booking.guests || 'N/A'} kishi</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Holat:</span>
                                <span class="detail-value">
                                    ${booking.status === 'confirmed' ? '✅ Tasdiqlangan' : 
                                      booking.status === 'pending' ? '⏳ Kutilmoqda' : '❌ Bekor qilingan'}
                                </span>
                            </div>
                            ${booking.notes ? `
                            <div class="detail-row">
                                <span class="detail-label">Qo'shimcha:</span>
                                <span class="detail-value">${booking.notes}</span>
                            </div>` : ''}
                            <div class="detail-row">
                                <span class="detail-label">Bron vaqti:</span>
                                <span class="detail-value">${new Date(booking.createdAt).toLocaleString('uz-UZ')}</span>
                            </div>
                        </div>
                        
                        <div class="modal-actions">
                            <button onclick="closeModal()" class="btn-secondary">Yopish</button>
                        </div>
                    `;
                    
                    showModal(modalContent);
                }
            });
        }
        
        function showModal(content) {
            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.style.position = 'fixed';
            modal.style.top = '0';
            modal.style.left = '0';
            modal.style.right = '0';
            modal.style.bottom = '0';
            modal.style.background = 'rgba(0,0,0,0.5)';
            modal.style.display = 'flex';
            modal.style.justifyContent = 'center';
            modal.style.alignItems = 'center';
            modal.style.zIndex = '1000';
            
            const modalContent = document.createElement('div');
            modalContent.className = 'modal-content';
            modalContent.style.background = 'white';
            modalContent.style.padding = '30px';
            modalContent.style.borderRadius = '10px';
            modalContent.style.maxWidth = '500px';
            modalContent.style.width = '90%';
            modalContent.style.maxHeight = '80vh';
            modalContent.style.overflowY = 'auto';
            
            modalContent.innerHTML = `
                <span class="close-modal" onclick="this.parentElement.parentElement.remove()" style="
                    position: absolute;
                    top: 15px;
                    right: 15px;
                    font-size: 24px;
                    cursor: pointer;
                    color: #999;
                ">&times;</span>
                ${content}
            `;
            
            modal.appendChild(modalContent);
            document.body.appendChild(modal);
            
            // Close modal when clicking outside
            modal.addEventListener('click', function(e) {
                if (e.target === modal) {
                    modal.remove();
                }
            });
        }
        
        function closeModal() {
            const modal = document.querySelector('.modal-overlay');
            if (modal) {
                modal.remove();
            }
        }
        
        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = `notification notification-${type}`;
            notification.innerHTML = `
                <div class="notification-content">
                    <i class="fas fa-${type === 'success' ? 'check-circle' : 
                                     type === 'error' ? 'exclamation-circle' : 
                                     type === 'warning' ? 'exclamation-triangle' : 'info-circle'}"></i>
                    <span>${message}</span>
                </div>
                <button onclick="this.parentElement.remove()">&times;</button>
            `;
            
            notification.style.position = 'fixed';
            notification.style.top = '20px';
            notification.style.right = '20px';
            notification.style.zIndex = '9999';
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                if (notification.parentElement) {
                    notification.remove();
                }
            }, 5000);
        }
        
        function logout() {
            if (confirm('Tizimdan chiqishni istaysizmi?')) {
                auth.signOut().then(() => {
                    showNotification('Tizimdan chiqdingiz', 'info');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1500);
                }).catch(error => {
                    showNotification('Chiqish xatosi: ' + error.message, 'error');
                });
            }
        }
        
        // Handle window resize
        window.addEventListener('resize', function() {
            const navLinks = document.querySelector('.nav-links');
            if (window.innerWidth > 768 && navLinks) {
                navLinks.style.display = 'flex';
                navLinks.style.flexDirection = 'row';
                navLinks.style.position = 'static';
                navLinks.style.background = 'transparent';
                navLinks.style.padding = '0';
                navLinks.style.boxShadow = 'none';
            } else if (window.innerWidth <= 768 && navLinks) {
                navLinks.style.display = 'none';
            }
        });
    </script>
</body>
</html>
