<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirish - BUKHARA REST</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">🏰 BUKHARA REST</a>
            <div class="nav-links">
                <a href="index.html">Asosiy</a>
                <a href="menu.html">Menyu</a>
                <a href="booking.html">Bron Qilish</a>
                <a href="about.html">Biz Haqimizda</a>
                <a href="contact.html">Aloqa</a>
                <a href="auth.html" class="btn-login active"><i class="fas fa-user"></i> Kirish</a>
                <a href="admin.html" class="btn-admin"><i class="fas fa-cog"></i> Admin</a>
            </div>
            <div class="hamburger">
                <i class="fas fa-bars"></i>
            </div>
        </div>
    </nav>
    <section class="section">
        <div class="container">
            <div class="admin-login-container">
                <div class="admin-login-box">
                    <h2 class="section-title">Kirish</h2>
                    <form id="emailLoginForm" class="admin-login-form">
                        <div class="form-group">
                            <label for="loginEmail">Email</label>
                            <input type="email" id="loginEmail" placeholder="email@example.com" required>
                        </div>
                        <div class="form-group">
                            <label for="loginPassword">Parol</label>
                            <input type="password" id="loginPassword" placeholder="Parol" required>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn-primary"><i class="fas fa-sign-in-alt"></i> Kirish</button>
                        </div>
                        <div id="loginMessage" style="margin-top:20px;"></div>
                    </form>
                    <div class="link" style="margin-top:20px;">
                        <a href="index.html"><i class="fas fa-arrow-left"></i> Saytga qaytish</a>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <footer class="footer">
        <div class="container">
            <div class="footer-grid">
                <div>
                    <h3>BUKHARA REST</h3>
                    <p>O'zbek milliy taomlarining eng yaxshi namunalari</p>
                </div>
                <div>
                    <h3>Foydali Havolalar</h3>
                    <a href="menu.html">Menyu</a>
                    <a href="booking.html">Bron Qilish</a>
                    <a href="about.html">Biz Haqimizda</a>
                </div>
                <div>
                    <h3>Ijtimoiy Tarmoqlar</h3>
                    <div class="social-icons">
                        <a href="#"><i class="fab fa-facebook"></i></a>
                        <a href="#"><i class="fab fa-instagram"></i></a>
                        <a href="#"><i class="fab fa-telegram"></i></a>
                    </div>
                </div>
            </div>
            <p class="copyright">© 2024 BUKHARA REST. Barcha huquqlar himoyalangan.</p>
        </div>
    </footer>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>
    <script>
    document.getElementById('emailLoginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        const loginMessage = document.getElementById('loginMessage');
        loginMessage.innerHTML = '';
        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            if (data.success) {
                loginMessage.innerHTML = '<span style="color:green">Kirish muvaffaqiyatli! Yo'naltirilmoqda...</span>';
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1200);
            } else {
                loginMessage.innerHTML = '<span style="color:red">' + (data.message || 'Email yoki parol xato!') + '</span>';
            }
        } catch (err) {
            loginMessage.innerHTML = '<span style="color:red">Serverda xatolik: ' + err.message + '</span>';
        }
    });
    </script>
</body>
</html>
