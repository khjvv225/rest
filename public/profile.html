<!DOCTYPE html>
<html lang="uz">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Mening Profilim - BUKHARA REST</title>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
	<link rel="stylesheet" href="styles.css">
	<style>
		.profile-container {
			max-width: 800px;
			margin: 0 auto;
			padding: 30px;
			background: white;
			border-radius: 10px;
			box-shadow: 0 5px 20px rgba(0,0,0,0.1);
		}
        
		.profile-header {
			text-align: center;
			margin-bottom: 40px;
			padding-bottom: 20px;
			border-bottom: 1px solid #eee;
		}
        
		.profile-avatar {
			width: 120px;
			height: 120px;
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			border-radius: 50%;
			margin: 0 auto 20px;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 48px;
			color: white;
		}
        
		.profile-name {
			font-size: 24px;
			color: var(--secondary);
			margin-bottom: 5px;
		}
        
		.profile-email {
			color: var(--gray);
			margin-bottom: 15px;
		}
        
		.profile-stats {
			display: grid;
			grid-template-columns: repeat(3, 1fr);
			gap: 20px;
			margin-bottom: 40px;
		}

			text-align: center;
			padding: 20px;
